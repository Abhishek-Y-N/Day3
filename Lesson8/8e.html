<!DOCTYPE html>
<html>
<head>
	<title>Exercise 8e</title>
	<style>
		.p1
		{
			font-family: Arial;
			font-weight: bold;
			font-size: 23px;
			margin-bottom: 24px;
		}

		.loc
		{
			width: 250px;
			padding-bottom: 8px;
			padding-top: 8px;
			padding-left: 12px;
			margin-bottom: 8px;
			background-color: rgb(243, 241, 241);
			border: none;
			display: block;
		}
		
		.des
		{
			width: 250px;
			padding-bottom: 8px;
			padding-top: 8px;
			padding-left: 12px;
			margin-bottom: 8px;
			background-color: rgb(243, 241, 241);
			border: none;
			display: block;
		}

		.btn1
		{
			background-color: black;
			color: white;
			font-weight: bold;
			border: none;
			padding-bottom: 12px;
			padding-top: 12px;
			padding-left: 8px;
			padding-right: 8px;
			margin-right: 12px;
		}

		.btn2
		{
			background-color: rgb(227, 225, 225);
			color: black;
			font-weight: bold;
			border: none;
			padding-bottom: 12px;
			padding-top: 12px;
			padding-left: 12px;
			padding-right: 12px;
			margin-right: 12px;
			margin-top: 12px;
		}
	</style>
</head>
<body>
	<p class="p1">Request A Ride Now</p>

	<input class="loc" type="text" placeholder="Enter Pickup Location">
	<input class="des" type="text" placeholder="Enter Destination">

	<button class="btn1">Request Now</button>
	<button class="btn2">Schedule For Later</button>
</body>
</html>
